name: CI Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts-drift:
    name: Contracts & Schemas Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for Schema Linting
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JSON Schemas
        run: |
          node -e "
            const fs = require('fs');
            const schemas = fs.readdirSync('contracts/schemas');
            schemas.forEach(file => {
              if (file.endsWith('.json')) {
                JSON.parse(fs.readFileSync('contracts/schemas/' + file, 'utf8'));
                console.log('Valid JSON Schema:', file);
              }
            });
          "

  typescript:
    name: TypeScript (mcp-server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Run Tests
        run: npm test

  go:
    name: Go (core-worker & gateway)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Test Core Worker
        working-directory: services/core-worker
        run: |
          go vet ./...
          go test -v ./...

      - name: Test Gateway
        working-directory: services/gateway
        run: |
          go vet ./...
          go test -v ./...

  python:
    name: Python (media-ai)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: services/media-ai/requirements.txt

      - name: Install Dependencies
        working-directory: services/media-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Tests
        working-directory: services/media-ai
        run: |
          pytest -v
